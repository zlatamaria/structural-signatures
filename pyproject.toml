[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-signatures"
version = "0.1.0"
description = "Replay and inspect answer-local shortcut graphs for mathematical reasoning traces"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Maria Marina"}, {name = "Alexander Panchenko"}]
dependencies = ["numpy>=1.24,<3", "pandas>=2.1,<3", "networkx>=3.2,<4", "scipy>=1.10", "matplotlib>=3.7", "tqdm>=4.60"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbclient>=0.8", "nbformat>=5"]
model = ["sentence-transformers>=5.2", "transformers>=4.51", "torch>=2.2", "huggingface-hub>=0.30"]
test = ["pytest>=7"]

[project.scripts]
structural-signatures = "structural_signatures.cli:main"

[project.urls]
Paper = "https://aclanthology.org/2026.mathnlp-main.15/"
Repository = "https://github.com/zlatamaria/structural-signatures"

[tool.setuptools.packages.find]
where = ["src"]
